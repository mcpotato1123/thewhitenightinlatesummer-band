<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夏末白夜 · 手环版模拟器</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; background: #eceef2;
         display: flex; align-items: center; justify-content: center;
         font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  .shell { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; }
  .watch { width: 372px; height: 516px; border-radius: 46px; background: #dfe2e8;
           padding: 18px; box-shadow: 0 18px 50px rgba(30, 34, 44, .22), inset 0 0 0 2px #c9cdd5;
           box-sizing: border-box; }
  .stage { position: relative; width: 336px; height: 480px; background: #f5f5f7; overflow: hidden;
           border-radius: 24px; user-select: none; }
  .hint { color: #7a8090; font-size: 12px; letter-spacing: .3px; }

  .bgclip { position: absolute; inset: 0; overflow: hidden; }
  .bgwide { position: absolute; top: 0; left: 0; width: 672px; height: 480px; }
  .solid { position: absolute; inset: 0; background: #fff; }
  .sp { position: absolute; object-fit: contain; }
  .layer { position: absolute; inset: 0; width: 336px; height: 480px; object-fit: cover; }

  .hud { position: absolute; top: 10px; left: 12px; height: 28px; padding: 0 12px;
         border-radius: 14px; background: rgba(0,0,0,.42); display: flex; align-items: center;
         gap: 8px; font-size: 15px; color: #fff; max-width: 312px; overflow: hidden; }
  .hud d { font-size: 12px; color: #e6e6ea; }

  /* 对白板：贴底、圆角、半透明深色 */
  .panel { position: absolute; top: 300px; left: 0; width: 336px; height: 180px;
           background: linear-gradient(180deg, rgba(14,16,24,.04) 0%, rgba(14,16,24,.70) 17%,
                       rgba(14,16,24,.86) 39%, rgba(14,16,24,.91) 100%);
           box-sizing: border-box; }
  .name { position: absolute; top: 306px; left: 18px; padding: 3px 12px; border-radius: 14px;
          background: rgba(14,16,24,.62); font-size: 24px; font-weight: 700; color: #fff; }
  .ln { position: absolute; left: 18px; width: 300px; color: #fff; font-size: 20px;
        line-height: 24px; white-space: pre; }
  .more { position: absolute; top: 452px; left: 306px; font-size: 16px; color: #ffd166;
          animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .choices { position: absolute; top: 186px; left: 18px; width: 300px; }
  .choice { width: 300px; min-height: 52px; box-sizing: border-box; padding: 10px;
            margin-bottom: 10px; border-radius: 14px; background: rgba(255,255,255,.94);
            color: #111; font-size: 24px; line-height: 32px; }

  /* 控制中心：浅底 + 淡黄条 + 黑体大字 */
  .menu { position: absolute; inset: 0; background: #f5f5f7; display: flex; flex-direction: column;
          align-items: center; padding-top: 14px; box-sizing: border-box; }
  .menu h3 { margin: 0; font-size: 32px; color: #333; }
  .menu p { margin: 2px 0 10px; font-size: 15px; color: #888; }
  .mbtn { width: 290px; height: 40px; background: rgba(226,216,120,.27); color: #000;
          font-size: 24px; font-weight: 800; display: flex; align-items: center;
          justify-content: center; margin-bottom: 6px; box-sizing: border-box; }
  .mbtn.main { background: rgba(226,216,120,.62); }
  .mrow { width: 290px; display: flex; gap: 6px; }
  .mrow .mbtn { width: 142px; }

  .ending { position: absolute; inset: 0; background: #f5f5f7; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #333; }
  .ending b { font-size: 34px; }
  .ending span { font-size: 20px; color: #999; margin-top: 26px; }

  /* 标题页：上方原画 + 浅色菜单板 */
  .title { position: absolute; inset: 0; background: #f5f5f7; }
  .title img.bg { position: absolute; inset: 0; width: 336px; height: 480px; object-fit: cover; }
  .title img.logo { position: absolute; top: 26px; left: 64px; width: 208px; height: 129px; object-fit: contain; }
  .title .panel { position: absolute; top: 214px; height: 266px; background: rgba(245,245,247,.97);
                  display: flex; flex-direction: column; align-items: center; padding-top: 6px;
                  box-sizing: border-box; border-radius: 0; border-top: none; }
  .title .resume { display: none; }
  .title .btn { width: 300px; height: 42px; background: transparent; color: #000; font-size: 28px;
                font-weight: 800; display: flex; align-items: center; justify-content: center;
                border-bottom: 1px solid #e0e0e0; margin: 0; }
  .title .btn.main { background: transparent; }
  .title .row { width: 300px; display: flex; gap: 0; }
  .title .row .btn { width: 150px; font-size: 20px; }

  .chapterlist { position: absolute; inset: 0; background: #f5f5f7; overflow-y: auto;
                 padding: 8px 0; box-sizing: border-box; }
  .chapterlist h3 { margin: 4px 0 10px; text-align: center; font-size: 30px; color: #333; }
  .chapterlist .row { width: 312px; margin: 0 12px 8px; height: 58px; border-radius: 12px;
                      background: rgba(255,255,255,.92); border: 1px solid #e0e0e0;
                      display: flex; align-items: center; gap: 10px; padding: 0 14px;
                      box-sizing: border-box; color: #222; font-size: 24px; font-weight: 700; }
  .chapterlist .row em { color: #999; font-style: normal; font-size: 20px; width: 34px; }
</style>
</head>
<body>
<div class="shell">
  <div class="watch">
    <div class="stage" id="stage">
      <div class="bgclip"><img class="bgwide" id="bg" alt=""></div>
      <div class="solid" id="solid"></div>
      <img class="sp" id="spL" alt=""><img class="sp" id="spLf" alt=""><img class="sp" id="spLb" alt="">
      <img class="sp" id="spC" alt=""><img class="sp" id="spCf" alt=""><img class="sp" id="spCb" alt="">
      <img class="sp" id="spR" alt=""><img class="sp" id="spRf" alt=""><img class="sp" id="spRb" alt="">
      <img class="layer" id="cg" alt="" style="display:none">

      <div class="hud" id="hud"><span id="hudT"></span><d id="hudD"></d></div>
      <div class="panel" id="panel"></div>
      <div class="name" id="name"></div>
      <div class="ln" id="l0"></div><div class="ln" id="l1"></div><div class="ln" id="l2"></div>
      <div class="ln" id="l3"></div><div class="ln" id="l4"></div><div class="ln" id="l5"></div>
      <div class="more" id="more">▼</div>
      <div class="choices" id="choices"></div>
      <div class="ending" id="ending" style="display:none"><b>本章 · 完</b><span>点击返回标题</span></div>
      <div class="menu" id="menu" style="display:none">
        <h3>菜单</h3><p id="menuSub"></p>
        <div class="mbtn main" data-act="close">继续阅读</div>
        <div class="mbtn" data-act="auto">自动播放</div>
        <div class="mbtn" data-act="fast">快进</div>
        <div class="mrow"><div class="mbtn" data-act="rewind">回退一句</div><div class="mbtn" data-act="home">返回标题</div></div>
        <div class="mrow"><div class="mbtn" data-act="chapters">章节</div><div class="mbtn" data-act="size">字号 +2</div></div>
        <div class="mbtn" data-act="exit">退出应用</div>
      </div>
      <div class="title" id="titleScr">
        <img id="titleBg" class="bg" alt=""><div class="shade"></div>
        <img class="logo" src="../src/common/img/ui/logo.png" alt="">
        <div class="panel">
          <div class="resume" id="resumeLine">从序章开始阅读</div>
          <div class="btn main" data-act="start">开始阅读</div>
          <div class="row"><div class="btn" data-act="chapters">章节</div><div class="btn" data-act="about">关于</div></div>
          <div class="btn" data-act="exit" style="width:236px;height:30px;font-size:14px;color:#cfc3cb">退出应用</div>
        </div>
      </div>
      <div class="chapterlist" id="chapScr" style="display:none"></div>
    </div>
  </div>
  <div class="hint">点画面推进 · 下滑开菜单 · 上滑/点菜单选章节 · 这是浏览器模拟器，非真机</div>
</div>

<script src="vm.bundle.js"></script>
<script src="assets.bundle.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
